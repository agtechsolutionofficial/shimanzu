<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1628"/>
      <stop offset="100%" stop-color="#050b14"/>
    </linearGradient>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#10b981" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- High-contrast badge background for dark and light tabs -->
  <rect width="128" height="128" rx="28" fill="url(#bgGrad)"/>
  <rect width="128" height="128" rx="28" fill="none" stroke="rgba(16, 185, 129, 0.25)" stroke-width="2"/>

  <!-- Shimanzu Japan Iconic Grain Emblem -->
  <g transform="translate(64, 60)" filter="url(#glow)">
    <!-- Central seed (top) -->
    <path d="M0 -34 C-6 -22 -6 -16 0 -10 C6 -16 6 -22 0 -34 Z" fill="url(#greenGrad)"/>

    <!-- Central stem -->
    <line x1="0" y1="-10" x2="0" y2="28" stroke="url(#greenGrad)" stroke-width="4.5" stroke-linecap="round"/>

    <!-- Leaf Pair 1 (Top) -->
    <path d="M0 -8 C-14 -16 -18 -26 -16 -32 C-7 -27 -1 -17 0 -8 Z" fill="url(#greenGrad)"/>
    <path d="M0 -8 C14 -16 18 -26 16 -32 C7 -27 1 -17 0 -8 Z" fill="url(#greenGrad)"/>

    <!-- Leaf Pair 2 (Middle) -->
    <path d="M0 6 C-18 -2 -24 -14 -22 -22 C-10 -15 -2 -4 0 6 Z" fill="url(#greenGrad)"/>
    <path d="M0 6 C18 -2 24 -14 22 -22 C10 -15 2 -4 0 6 Z" fill="url(#greenGrad)"/>

    <!-- Leaf Pair 3 (Bottom) -->
    <path d="M0 20 C-22 10 -28 -2 -26 -12 C-12 -5 -3 8 0 20 Z" fill="url(#greenGrad)"/>
    <path d="M0 20 C22 10 28 -2 26 -12 C12 -5 3 8 0 20 Z" fill="url(#greenGrad)"/>

    <!-- Outer U-bracket / Shield stalks -->
    <path d="M-36 -32 V12 C-36 28 -18 38 0 42 C18 38 36 28 36 12 V-32" 
          fill="none" stroke="url(#greenGrad)" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Base Node with Japan Red Dot Accent -->
    <circle cx="0" cy="42" r="5" fill="#E52320"/>
  </g>
</svg>
